<html>
    <head>
        <title>"Reader's Haven- Book Registration & Order Form</title>
    </head>
    <body>
        <form>
            <label>Customer Name</label>
            <input type="text" placeholder="name"><br>
            <label>Email Address</label>
            <input type="text" placeholder="@gmail.com"><br>
            <label>Mobile Number</label>
            <input type="number" placeholder="98765XXXXX"><br>
            <label>Age</label>
            <input type="number" placeholder="eg.123"><br>
            <label>Password</label>
            <input type="password" placeholder="enter your password"><br>
            <label>Delivery Date</label>
            <input type="date"><br>
            <label> Preferred Delivery Time </label>
            <input type="time"><br>
            <select>
                <option>Fiction</option>
                <option>Science</option>
                <option>History</option>
                <option required>Children's Books </option>
            </select>
            <br>
            <label>Book Title</label>
            <input type="text"><br>
            <label>Quantity</label>
            <input type="number" min="2"><br>
            <u><label>Preferred Payment Method</label></u><br>
            <label>Cash on Delivery</label>
            <input type="radio"><br>
            <label>Online Payment</label>
            <input type="radio"><br>
           <u> <label>Additional Services</label><br></u>
            <label>Gift Wrapping</label>
            <input type="checkbox"><br>
            <label>Bookmark Express Delivery</label>
            <input type="checkbox"><br>
            <label>Greeting card</label>
            <input type="checkbox">
            <input type="hidden" value="Readers Haven Book Order"><br>
            <label>file upload</label>
            <input type="file"><br>
            <label>Delivery Address</label>
           <textarea rows="6" cols="6" maxlength="10" minlength="10=">

           </textarea><br>
           <label>Special Instructions</label>
           <textarea rows="6" cols="6" maxlength="10" minlength="10">

           </textarea><br>
           <button type="submit">
            Submit
           </button>
           <button type="reset">
            Reset
           </button>

        </form>
    </body>
</html>
